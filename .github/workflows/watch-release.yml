name: watch-grok-build-release

on:
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  check-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch upstream grok-build
        run: |
          git clone --depth 1 https://github.com/xai-org/grok-build.git /tmp/grok-build
          echo "UPSTREAM_REV=$(git -C /tmp/grok-build rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "UPSTREAM_REV=$UPSTREAM_REV"

      - name: Apply livepatch
        id: apply
        run: |
          set -euo pipefail
          cd /tmp/grok-build
          if git apply --check "$GITHUB_WORKSPACE/patches/0001-ban-generic-subagents.patch"; then
            git apply "$GITHUB_WORKSPACE/patches/0001-ban-generic-subagents.patch"
            echo "result=ok" >> "$GITHUB_OUTPUT"
          else
            echo "result=needs-rebase" >> "$GITHUB_OUTPUT"
            git apply --reject "$GITHUB_WORKSPACE/patches/0001-ban-generic-subagents.patch" || true
            find . -name '*.rej' | head
            exit 2
          fi

      - name: Unit smoke
        if: steps.apply.outputs.result == 'ok'
        run: |
          cd /tmp/grok-build
          cargo test -p xai-tool-types banned_subagent -- --nocapture

      - name: Open issue on patch break
        if: failure() && steps.apply.outputs.result == 'needs-rebase'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `livepatch needs rebase against grok-build@${process.env.UPSTREAM_REV}`;
            const body = [
              'The 6h watch failed to apply `patches/0001-ban-generic-subagents.patch` cleanly.',
              '',
              `Upstream tip: \`${process.env.UPSTREAM_REV}\``,
              '',
              'Please refresh the patch against current `xai-org/grok-build` main.',
            ].join('\n');
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'livepatch-break',
            });
            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['livepatch-break'],
              });
            }
