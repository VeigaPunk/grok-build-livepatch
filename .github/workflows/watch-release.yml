name: watch-grok-build-release

on:
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  check-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Script syntax + --help gates
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          ./scripts/gates.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch upstream grok-build
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/xai-org/grok-build.git /tmp/grok-build
          UPSTREAM_REV=$(git -C /tmp/grok-build rev-parse HEAD)
          echo "UPSTREAM_REV=$UPSTREAM_REV" >> "$GITHUB_ENV"
          echo "UPSTREAM_REV=$UPSTREAM_REV"

      - name: Apply livepatch series
        id: apply
        run: |
          set -euo pipefail
          cd /tmp/grok-build
          shopt -s nullglob
          patches=("$GITHUB_WORKSPACE"/patches/*.patch)
          if [[ ${#patches[@]} -eq 0 ]]; then
            echo "no patches" >&2
            exit 1
          fi
          for p in "${patches[@]}"; do
            echo "apply-check $(basename "$p")"
            if ! git apply --check "$p"; then
              echo "result=needs-rebase" >> "$GITHUB_OUTPUT"
              git apply --reject "$p" || true
              find . -name '*.rej' | head
              exit 2
            fi
          done
          for p in "${patches[@]}"; do
            git apply "$p"
            echo "applied $(basename "$p")"
          done
          echo "result=ok" >> "$GITHUB_OUTPUT"

      - name: Unit smoke
        if: steps.apply.outputs.result == 'ok'
        run: |
          cd /tmp/grok-build
          cargo test -p xai-tool-types banned_subagent -- --nocapture

      - name: Open issue on patch break
        if: failure() && steps.apply.outputs.result == 'needs-rebase'
        uses: actions/github-script@v7
        with:
          script: |
            const rev = process.env.UPSTREAM_REV || 'unknown';
            const title = `livepatch needs rebase against grok-build@${rev}`;
            const body = [
              'The 6h watch failed to apply the livepatch series (`patches/0001` + `patches/0002`) cleanly.',
              '',
              `Upstream tip: \`${rev}\``,
              '',
              'Please refresh the patch against current `xai-org/grok-build` main.',
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'livepatch-break',
            }).catch(() => ({ data: [] }));
            if (issues.length > 0) {
              console.log('open livepatch-break issue already exists');
              return;
            }
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['livepatch-break'],
              });
            } catch (e) {
              // Label may not exist on first break — create without labels.
              console.log('create with label failed, retrying without labels:', e.message || e);
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
